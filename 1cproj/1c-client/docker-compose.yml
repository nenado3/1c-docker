services:
  onec-client:
    build:
      context: .
      args:
        ONEC_VERSION: ${ONEC_VERSION}
        ONEC_RUN_COMPONENTS: ${ONEC_RUN_COMPONENTS:-client_full,client_thin,ru}
        # UID пользователя хоста: нужен для доступа к X11 и чтобы файлы в ./export были «своими»
        USER_UID: ${CLIENT_UID:-1000}
    container_name: onec-client
    hostname: onec-client
    restart: unless-stopped
    # Общий лимит памяти клиентского контейнера для всех пользовательских сеансов; 0 — без ограничения.
    mem_limit: ${CLIENT_MEMORY_LIMIT:-0}
    command: ["sleep", "infinity"]
    shm_size: "1gb"
    security_opt:
      - label=disable
    # Кластер 1С сообщает клиенту имя сервера "onec-server": направляем его на IP удалённой машины.
    # Значение по умолчанию нужно только для сборки (SERVER_IP не требуется для build);
    # пустой SERVER_IP при запуске отсекает ./client.sh.
    extra_hosts:
      - "onec-server:${SERVER_IP:-127.0.0.1}"
    environment:
      - DISPLAY=${DISPLAY:-}
      - NO_AT_BRIDGE=1
      - GTK_A11Y=none
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - onec-client-home:/home/user1c
      - ./licenses:/var/1C/licenses:z
      # nethasp.ini монтируется, а не «запекается»: правка NETHASP_ADDRS + ./client.sh recreate
      # применяется без пересборки образа (common.sh пересоздаёт файл при каждом запуске скриптов)
      - ./nethasp.ini:/opt/1cv8/conf/nethasp.ini:ro
      - ${EXPORT_DIR:-./export}:/home/user1c/export:z

volumes:
  onec-client-home:
