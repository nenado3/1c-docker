services:
  postgres:
    build:
      context: ./postgres
      args:
        BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-ubuntu:26.04}
    container_name: onec-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-0}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in 1c-server/.env}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/pgbin/pg_isready -U ${POSTGRES_USER:-postgres} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
    stop_grace_period: 1m
    networks: [onec]

  onec-server:
    build:
      context: ./server
      args:
        BASE_IMAGE: ${SERVER_BASE_IMAGE:-ubuntu:24.04}
        ONEC_VERSION: ${ONEC_VERSION}
        ONEC_RUN_COMPONENTS: ${ONEC_RUN_COMPONENTS:-server,server_admin,client_full,ws,ru}
    container_name: onec-server
    hostname: onec-server
    restart: unless-stopped
    mem_limit: ${SERVER_MEMORY_LIMIT:-0}
    stop_grace_period: 2m
    environment:
      HTTPS_CERT_FILE: ${HTTPS_CERT_FILE:-}
      HTTPS_KEY_FILE: ${HTTPS_KEY_FILE:-}
      HTTPS_CERT_SAN: ${HTTPS_CERT_SAN:-IP:192.168.239.130,IP:127.0.0.1,DNS:localhost,DNS:onec-server}
    ports:
      - "80:80"
      - "443:443"
      - "1540:1540"
      - "1541:1541"
      - "127.0.0.1:1545:1545"
      - "1560-1591:1560-1591"
    volumes:
      - onec-data:/home/usr1cv8/.1cv8
      - apache-config:/etc/apache2
      - apache-web:/var/www/onec
      - ./licenses:/var/1C/licenses:z
      - ./server/nethasp.ini:/opt/1cv8/conf/nethasp.ini:ro,z
      - ./certs:/etc/onec-certs:ro,z
      - ${BACKUP_DIR:-./backups}:/home/usr1cv8/backups:z
    depends_on:
      postgres:
        condition: service_healthy
    networks: [onec]

volumes:
  onec-data:
  pg-data:
  apache-config:
  apache-web:

networks:
  onec:
    name: onec-net
